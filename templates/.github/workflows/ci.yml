name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Test ({{STACK}})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Python setup (remove if {{STACK}} = node)
      - uses: actions/setup-python@v5
        if: "'{{STACK}}' == 'python'"
        with:
          python-version: "3.12"
          cache: "pip"

      # Node setup (remove if {{STACK}} = python)
      - uses: actions/setup-node@v4
        if: "'{{STACK}}' == 'node'"
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps (python)
        if: "'{{STACK}}' == 'python'"
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]" || .venv/bin/pip install -r requirements.txt

      - name: Install deps (node)
        if: "'{{STACK}}' == 'node'"
        run: npm ci

      - name: Lint (python)
        if: "'{{STACK}}' == 'python'"
        run: .venv/bin/ruff check . || true

      - name: Lint (node)
        if: "'{{STACK}}' == 'node'"
        run: npm run lint --if-present

      - name: Type check (node)
        if: "'{{STACK}}' == 'node'"
        run: npx tsc --noEmit

      - name: Test (python)
        if: "'{{STACK}}' == 'python'"
        run: PYTHONPATH=. .venv/bin/pytest -q

      - name: Test (node)
        if: "'{{STACK}}' == 'node'"
        run: npm test --if-present

  build-image:
    name: Build Docker image
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: {{PROJECT_NAME}}:${{ github.sha }}
