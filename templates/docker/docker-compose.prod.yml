services:
  app:
    image: {{PROJECT_NAME}}:${VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      - PORT={{PORT}}
    ports:
      - "127.0.0.1:{{PORT}}:{{PORT}}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:{{PORT}}{{HEALTH_PATH}}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_USER: {{PROJECT_NAME}}
      POSTGRES_DB: {{PROJECT_NAME}}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{PROJECT_NAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
