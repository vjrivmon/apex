global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "{{PROJECT_NAME}}"
    env: "prod"

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "{{PROJECT_NAME}}"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["app:{{PORT}}"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
