version: "3.9"

services:
  apex-backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8020}:8020"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  apex-frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3020}:3000"
    env_file: .env
    depends_on:
      apex-backend:
        condition: service_healthy
    restart: unless-stopped
