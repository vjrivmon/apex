[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-harness"
version = "0.1.0"
description = "A self-improving harness for LLM coding agents across the software lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Vicente Rivas Monferrer" },
  { name = "Juan Miguel Alberola" },
  { name = "Víctor Sánchez-Anguix" },
  { name = "Vicente Julián" },
]
keywords = [
  "llm-agents", "agentic-software-engineering", "developer-harness",
  "context-engineering", "self-improving-systems", "claude-code",
  "model-context-protocol",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=1.0",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "requests>=2.30",
  "websockets>=12.0",
]

[project.optional-dependencies]
# Required only by the executable prototypes that skills/prototype scaffolds
# (Textual TUIs) and by tools/smoke_prototype.sh.
prototype = ["textual>=0.50"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "textual>=0.50",
]

[project.urls]
Homepage = "https://github.com/vjrivmon/apex-harness"
Repository = "https://github.com/vjrivmon/apex-harness"
Paper = "https://github.com/vjrivmon/apex-harness/blob/main/docs/paper-ase2026/main.pdf"

# APEX is not distributed as an importable package: `lib/` is a flat directory of
# modules loaded by the MCP server and the hooks. We therefore do not declare
# packages here. For tests and tooling, `lib/` is put on the path via pytest's
# `pythonpath` setting below, so `pytest` works straight after `pip install .[dev]`.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["lib"]
testpaths = ["tests"]
addopts = "-q"
